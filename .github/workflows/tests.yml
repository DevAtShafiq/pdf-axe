name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        # Pillow + pymupdf: PDF/image code exercised
        # by the desktop tests. file_ops / sfm_bridge only import the standard
        # library at module level, so no Windows-only packages (pywin32) are needed.
        run: |
          python -m pip install --upgrade pip
          pip install pytest Pillow pymupdf

      - name: Run tests
        run: python -m pytest -q tests
